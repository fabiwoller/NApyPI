name: Build wheels and run Linux integration tests

on:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pypa/cibuildwheel@v2.16
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-*"
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_*"
          CIBW_TEST_SKIP: "*-manylinux*"

          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

          # --- LINUX SETUP ---
          # Install OpenBLAS & LAPACK inside the manylinux Docker container
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: "dnf install -y openblas-devel lapack-devel"

          # --- MACOS SETUP ---
          # Install libomp, OpenBLAS, and LAPACK via Homebrew
          CIBW_BEFORE_BUILD_MACOS: "brew install libomp openblas lapack"
          CIBW_ENVIRONMENT_MACOS: >
            OpenMP_ROOT=$(brew --prefix libomp)
            OpenBLAS_DIR=$(brew --prefix openblas)
            MACOSX_DEPLOYMENT_TARGET=11.0

          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            delocate-listdeps {wheel} &&
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}

          # --- WINDOWS SETUP ---
          # vcpkg's openblas port is built without a Fortran compiler, so it ships BLAS
          # plus only a small C-translated LAPACK subset: find_package(LAPACK) fails its
          # cheev_ probe. The lapack metaport layers reference LAPACK (built through
          # vcpkg-gfortran) on top of OpenBLAS, which is what Armadillo needs since its
          # vendored config.hpp enables ARMA_USE_LAPACK.
          #
          # Deliberately no CMAKE_PREFIX_PATH: pointing it at the vcpkg tree makes plain
          # find_library resolve debug/lib ahead of the release library. The vcpkg
          # toolchain already selects the right one from CMAKE_BUILD_TYPE.
          #
          # Deliberately no BLA_VENDOR=OpenBLAS: reference LAPACK is a separate library
          # from OpenBLAS, so pinning the vendor sends find_package(LAPACK) back to
          # probing openblas.lib for cheev_ and it fails the same way.
          CIBW_BEFORE_ALL_WINDOWS: "vcpkg install openblas:x64-windows lapack:x64-windows"
          CIBW_ENVIRONMENT_WINDOWS: >
            CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

          # cibuildwheel does not repair Windows wheels by default, so the OpenBLAS DLL
          # that _core links against would not be vendored into the wheel and `import
          # napypi` would fail with a DLL load error on any machine without vcpkg.
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
            delvewheel repair --add-path C:/vcpkg/installed/x64-windows/bin
            -w {dest_dir} {wheel}

          CIBW_TEST_COMMAND: >
            python -c "import napypi; print(napypi.__version__)"

      # Make wheels available to other jobs
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl


  sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        run: pipx run build --sdist

      - name: Check sdist metadata
        run: pipx run twine check dist/*.tar.gz

      # The sdist is the only install path for platforms with no wheel, and it is
      # useless unless every vendored header tree made it in. Verify rather than assume.
      - name: Verify sdist is buildable
        run: |
          python - <<'EOF'
          import glob, sys, tarfile

          tarball = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(tarball) as tar:
              names = tar.getnames()
          root = names[0].split("/")[0]

          required = [
              "CMakeLists.txt",
              "pyproject.toml",
              "src/napy.cpp",
              "src/linear_reg.cpp",
              "src/multinomial_reg.cpp",
              "src/multinomial_reg_impl.cpp",
              "include/stats.hpp",
              "python/napypi/__init__.py",
              "third_party/eigen3/eigen3/Eigen/Dense",
              "third_party/boost/boost/math/distributions/normal.hpp",
              "third_party/mlpack/src/mlpack.hpp",
              "third_party/armadillo/armadillo",
              "third_party/ensmallen/ensmallen.hpp",
          ]
          missing = [p for p in required if f"{root}/{p}" not in names]
          if missing:
              sys.exit("sdist is missing required files:\n  " + "\n  ".join(missing))

          # The stale third_party/eigen submodule must stay out (see pyproject.toml).
          stale = [n for n in names if n.startswith(f"{root}/third_party/eigen/")]
          if stale:
              sys.exit(f"sdist unexpectedly contains {len(stale)} third_party/eigen files")

          print(f"sdist OK: {tarball}, {len(names)} entries")
          EOF

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz


  integration-tests-linux:
    name: Linux integration tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1 libopenblas-dev liblapack-dev

      - name: Install napypi + CPU-only torch
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install .

      - name: Run integration tests
        run: |
          python - <<'EOF'
          import napypi
          print("napypi:", napypi.__version__)
          EOF


  publish:
    name: Publish wheels to PyPI
    runs-on: ubuntu-latest

    needs: [build, sdist, integration-tests-linux]

    # Never publish from PRs
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      # Download all wheel artifacts plus the sdist
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # Flatten directory structure
      - name: Prepare distributions for upload
        run: |
          mkdir upload
          find dist \( -name "*.whl" -o -name "*.tar.gz" \) -exec mv {} upload/ \;
          ls -la upload

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.8.10
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: upload
