[build-system]
requires = [
  "scikit-build-core>=0.9,<0.11",
  "pybind11>=2.11",
  "packaging>=23.1",
  "setuptools>=68"
]
build-backend = "scikit_build_core.build"

[project]
name = "napypi"
version = "1.1.9"
description = "Efficient statistics in Python for large-scale heterogeneous data with enhanced support for missing data"
readme = "README.md"
requires-python = ">=3.9, <3.12"
license = { text = "GPL-3.0-only" }
license-files = ["LICENSE"]
authors = [{name = "Fabian Woller"}]
dependencies = [
                "torch",
                "pandas",
                "numba==0.60.0",
                "numba-scipy==0.4.0",
                "numpy==1.26.*",
                "scipy==1.11.0"
                ]

[project.optional-dependencies]
# Only needed to run the test suite (validates NApy against pingouin/scipy/R).
# pingouin 0.6.1 requires Python >=3.10, so it is NOT a runtime dependency:
# pinning it as one breaks installing the cp39 wheel.
test = [
                "pingouin==0.6.1"
                ]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/napypi"]
cmake.args = ["-DCMAKE_SIZEOF_VOID_P=8"]
